<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Primary Meta Tags -->
  <title>CivicChain</title>
  <meta name="title" content="CivicChain" />
  <meta name="description"
    content="CivicChain is a civic issue reporting platform for Puducherry that helps citizens report local issues, share locations, track complaints, and connect with relevant municipal departments." />
  <meta name="keywords"
    content="CivicChain, Puducherry civic issues, Pondicherry municipal reporting, smart city Puducherry, civic issue reporting, citizen grievance portal, road maintenance Puducherry, sanitation reporting" />
  <meta name="author" content="CivicChain" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://civic-chain-tau.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CivicChain" />
  <meta property="og:url" content="https://civic-chain-tau.vercel.app/" />
  <meta property="og:title" content="CivicChain" />
  <meta property="og:description"
    content="CivicChain is a civic issue reporting platform for Puducherry that helps citizens report local issues, share locations, track complaints, and connect with relevant municipal departments." />
  <meta property="og:image" content="https://civic-chain-tau.vercel.app/hero-bg.jpg" />
  <meta property="og:image:alt" content="CivicChain Platform for Puducherry" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://civic-chain-tau.vercel.app/" />
  <meta name="twitter:title" content="CivicChain" />
  <meta name="twitter:description"
    content="CivicChain is a civic issue reporting platform for Puducherry that helps citizens report local issues, share locations, track complaints, and connect with relevant municipal departments." />
  <meta name="twitter:image" content="https://civic-chain-tau.vercel.app/hero-bg.jpg" />
  <meta name="twitter:image:alt" content="CivicChain Platform for Puducherry" />

  <!-- Structured Data (Schema.org WebSite & Organization) -->
  <script type="application/ld+json" id="civicchain-base-schema">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://civic-chain-tau.vercel.app/#website",
            "url": "https://civic-chain-tau.vercel.app/",
            "name": "CivicChain",
            "description": "Civic issue reporting platform for Puducherry that helps citizens report local issues, share locations, track complaints, and connect with relevant municipal departments.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://civic-chain-tau.vercel.app/issues?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            },
            "inLanguage": "en-IN"
          },
          {
            "@type": "GovernmentService",
            "@id": "https://civic-chain-tau.vercel.app/#service",
            "name": "CivicChain Civic Issue Reporting Service",
            "serviceType": "Civic Complaint and Municipal Dispatch Management",
            "provider": {
              "@type": "Organization",
              "name": "CivicChain Smart City Initiative",
              "url": "https://civic-chain-tau.vercel.app/",
              "logo": "https://civic-chain-tau.vercel.app/logo.png"
            },
            "areaServed": {
              "@type": "AdministrativeArea",
              "name": "Puducherry, India"
            },
            "description": "Public infrastructure complaint logging, AI classification, and municipal department routing for Puducherry citizens."
          }
        ]
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
