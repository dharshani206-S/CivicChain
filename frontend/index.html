    <!-- Structured Data (Schema.org WebSite & Organization) -->
    <script type="application/ld+json" id="civicchain-base-schema">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://civic-chain-tau.vercel.app/#website",
            "url": "https://civic-chain-tau.vercel.app/",
            "name": "CivicChain",
            "description": "AI-Powered Civic Incident Dispatch & Smart City Platform for Puducherry",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://civic-chain-tau.vercel.app/issues?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            },
            "inLanguage": "en-IN"
          },
          {
            "@type": "GovernmentService",
            "@id": "https://civic-chain-tau.vercel.app/#service",
            "name": "CivicChain Civic Issue Reporting Service",
            "serviceType": "Civic Complaint and Municipal Dispatch Management",

              "@type": "Organization",
              "name": "CivicChain Smart City Initiative",
              "url": "https://civic-chain-tau.vercel.app/",
              "logo": "https://civic-chain-tau.vercel.app/logo.png"
            },
            "areaServed": {
              "@type": "AdministrativeArea",
              "name": "Puducherry, India"
            },
            "description": "Public infrastructure complaint logging, AI classification, and municipal department routing for Puducherry citizens."
